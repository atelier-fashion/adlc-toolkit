# .adlc/config.yml — ADLC project configuration
#
# This file lives in every repo that originates REQs. "Primary" is per-REQ,
# not a fixed designation: whichever repo you invoke /proceed from becomes
# the primary for that REQ, so every repo that can host REQs needs its own
# `.adlc/` (from /init) and its own config.yml.
#
# The config in THIS repo describes the world from this repo's perspective:
# this repo is primary, the others are siblings. The sibling repos that also
# originate REQs will have their own config.yml files that mirror this —
# they'll mark themselves primary and list this one as a sibling. That's
# expected; the configs are symmetric by design.
#
# A repo that only ever participates as a sibling (never originates REQs)
# doesn't strictly need a config, but it's cheap insurance to set one up
# anyway so it can host a REQ later.
#
# Single-repo projects can leave this file absent OR include only a single
# entry under `repos:`. All ADLC skills fall back to legacy single-repo
# behavior in that case.
#
# ---------------------------------------------------------------------------
# QUICKSTART: copy a preset
# ---------------------------------------------------------------------------
# The fastest way to fill this in is to start from a preset that matches your
# stack, then replace the placeholder values.
#
#   cp "$ADLC_TOOLKIT_ROOT/presets/ios-firebase-cloudrun.yml" .adlc/config.yml
#
# $ADLC_TOOLKIT_ROOT is the installed toolkit (ToolkitRoot): on the symlink
# route the clone install.sh links into ~/.claude, and on the plugin route the
# plugin's cache copy, whose path `cat ~/.claude/adlc/plugin-root` prints. Set it
# in your shell first; the presets README has a one-line resolver that works on
# both routes.
#
# Available presets (see $ADLC_TOOLKIT_ROOT/presets/):
#   - ios-firebase-cloudrun.yml — iOS app + Firebase + Cloud Run backend
#
# If no preset matches, fill out the sections below from scratch.

# ---------------------------------------------------------------------------
# project: Display name and (optional) preset reference.
# ---------------------------------------------------------------------------
# `name` is shown in skill output and PR/commit metadata. It's the only place
# the project's human name appears — every skill reads it from here.
# `preset` is informational only: it records which preset (if any) this config
# was seeded from. Skills don't read it; it's a hint for `/template-drift`.

project:
  name: "My Project"
  # preset: ios-firebase-cloudrun

# ---------------------------------------------------------------------------
# stack: Tech stack declaration. Drives conditional skill behavior.
# ---------------------------------------------------------------------------
# Skills consult these lists before running stack-specific steps. For example,
# `/bugfix` and `/wrapup` only emit iOS deploy instructions when `frontends`
# includes `ios`. `/canary` only runs when `backends` includes `cloud-run`.
#
# Keep these lists honest — listing a platform you don't actually use will
# produce noisy output; omitting one will skip steps you actually need.
#
# Recognized values (extend by editing the relevant skill):
#   languages:  swift | typescript | javascript | python | go | rust | kotlin | java
#   frontends:  ios | android | web | mobile-rn | mobile-flutter
#   backends:   cloud-run | aws-lambda | k8s | nodejs-server | django | rails | none
#   databases:  firestore | postgres | mysql | dynamodb | mongodb | sqlite | none
#   ci:         github-actions | gitlab-ci | circleci | none

stack:
  languages: []
  frontends: []
  backends: []
  databases: []
  ci: github-actions

# ---------------------------------------------------------------------------
# repos: This repo plus every sibling it might coordinate with.
# ---------------------------------------------------------------------------
# The key is a short stable id (used in task frontmatter as `repo: <id>`).
# The entry for THIS repo has `primary: true` and no `path` (path is implicit).
# Sibling entries declare a `path:` relative to this repo's root (or absolute).
# Every sibling must be cloned locally at that path.

repos:
  # Example: primary is the web frontend
  web:
    primary: true
  # Example: siblings
  api:
    path: ../api
  mobile:
    path: ../mobile

# ---------------------------------------------------------------------------
# merge_order: Order Phase 8 merges PRs.
# ---------------------------------------------------------------------------
# List touched repo ids in the order they should merge. Typical pattern:
# data/backend first, then the services that consume them.
# If omitted, /proceed uses the order repos appear under `repos:` above.

merge_order:
  - api
  - web
  - mobile

# ---------------------------------------------------------------------------
# lanes: Limits for the lite lane. Optional.
# ---------------------------------------------------------------------------
# A REQ that `/spec` triages as `lite` skips architecture and the review
# panel. Before its PR leaves draft, `/proceed` runs a mechanical lane check
# of the diff against the integration branch (tools/adlc/lane_check.py), and
# any failing rule escalates the REQ to the full lane:
#   - blocked_paths  a changed file matching one of these globs, or a symlink
#   - dependencies   a changed lockfile or manifest, or a submodule (a fixed
#                    list, no key here)
#   - deploy_units   files in more than one unit (only when this is declared)
#   - max_files      more counted files than this; files matching
#                    `count_exclude` are not counted, but are still checked
#                    against the blocked paths and the dependency files
#
# Absent, the toolkit defaults apply: `max_files` 3; CI, deploy, infra,
# containers, migrations/SQL/proto/OpenAPI/schema, auth/security, `.env*`,
# keys and certificates, agent config (`.claude/**`, `CLAUDE.md`), git hooks,
# package-manager config and pipeline config paths blocked; tests, `.adlc/**`
# and `CHANGELOG*` not counted. The full lists are in partials/lane-check.md.
#
# `blocked_paths` and `count_exclude` EXTEND the defaults — they are added to
# the toolkit's lists and never replace them, so a project cannot unblock
# `.github/**` by declaring a list of its own. `max_files` replaces the
# default. `deploy_units` maps a glob to a unit name, and each counted file
# belongs to the first glob it matches.
#
# Globs are repo-relative: `*` stays within one directory, `**/` is zero or
# more directories, and a trailing `/**` is everything beneath. A trailing `/`
# means `/**`, and a plain path with no glob character also covers everything
# beneath it. `blocked_paths` match case-insensitively. An unknown key, a wrong
# type or an empty pattern makes every lane check report an error, which
# escalates; nothing here is silently skipped.
#
# The check reads this file as committed on the integration branch, never the
# copy in the branch under check, and this file is itself a blocked path. It
# is parsed only when `lanes` appears outside a whole-line comment, so this
# commented example costs nothing; once uncommented, parsing needs PyYAML in
# the interpreter the check runs under (the delegate venv).

# lanes:
#   lite:
#     max_files: 3
#     blocked_paths:
#       - "packages/domain/**"
#       - "services/api/src/schemas/**"
#     count_exclude:
#       - "content/**"
#     deploy_units:
#       "apps/website/**": website
#       "apps/admin/**": admin

# ---------------------------------------------------------------------------
# branches: Where feature work integrates.
# ---------------------------------------------------------------------------
# `integration` names the branch that feature branches are cut from and that
# PRs are opened against and merged into — the `<integration-branch>` of
# `/proceed` Phase 0 step 4, and the base `/sprint`, `/bugfix`, `/wrapup` and
# `/template-drift` use. Any branch name works: `dev`, `staging`, `main`, ...
#
# When this key is present it IS the integration branch — the skills read it
# and look no further. When it is absent (or this whole section is omitted),
# the skills fall back to detecting the branch model from signals: a declared
# `gcp.staging_project`, a `verify-head-ref` workflow under `.github/workflows/`,
# or "staging-first" / "staging → main promotion" wording in CLAUDE.md means
# `staging`; no signal means `main`. That detection cannot tell a two-branch
# repo (`staging` → `main`) from a three-branch one (`dev` → `staging` → `main`)
# — both declare a staging project — so set this key whenever feature work
# integrates anywhere other than the branch the signals would pick.
#
# A branch NAME only, never a ref: the skills still `git fetch origin` and base
# on `origin/<integration>`, never on a stale local ref (LESSON-036).
#
# Repos whose detected branch is already right can leave this section out —
# nothing changes for them.

# branches:
#   integration: dev

# ---------------------------------------------------------------------------
# sprint: The `/sprint --exec` engine. Optional.
# ---------------------------------------------------------------------------
# Read once at launch and frozen for the run, so an edit changes nothing for a
# live one. `child_gh_token` is the NAME of a variable holding a token without
# `contents: write`, never a token. Without it a launch needs
# `--shared-credentials`. `require_branch_protection` defaults to true, and an
# operator who accepts the risk for one run passes `--allow-unprotected`.
# `deploy` is the one deploy the engine will run, after approval, and only from
# the copy of this file on the integration branch. `allow_extra` adds routine
# entries, as argv lists; one that wraps a deny-tier command is refused.
#
# sprint:
#   exec:
#     child_gh_token: ADLC_CHILD_GH_TOKEN
#     stall_minutes: 20
#     require_branch_protection: true
#     auto_rebase_max_attempts: 1
#     allow_extra:
#       - [pytest]
#     deploy:
#       target: production
#       command: "./deploy.sh production"

# ---------------------------------------------------------------------------
# gcp: GCP-specific deploy config. Only relevant if `stack.backends` includes
# `cloud-run` or your CI/CD targets GCP.
# ---------------------------------------------------------------------------
# `staging_project` and `production_project` are the GCP project IDs that
# `/bugfix` and `/wrapup` query to confirm a deploy succeeded.
# `default_region` is used by `/canary` and the deploy-confirmation gcloud
# commands when a service entry doesn't specify its own region.
#
# If you don't deploy to GCP, omit this whole section.

gcp:
  staging_project: <staging-gcp-project-id>
  production_project: <production-gcp-project-id>
  default_region: us-central1

# ---------------------------------------------------------------------------
# ios: iOS-specific deploy config. Only relevant if `stack.frontends`
# includes `ios`.
# ---------------------------------------------------------------------------
# `deploy_targets` is the list of WiFi-paired devices (or simulators) that
# `/bugfix` and `/wrapup` deploy to after merge. Listing more than one means
# every device gets the build — drop devices you don't need to keep current.
# `derived_data_clean: true` runs `rm -rf ~/Library/Developer/Xcode/DerivedData/*`
# before each deploy (recommended — avoids stale-build issues).
# `deploy_command` is the script the skill invokes from the iOS repo root.
#
# If you don't ship iOS, omit this whole section.

ios:
  deploy_targets: []
  derived_data_clean: true
  deploy_command: "./deploy.sh"

# ---------------------------------------------------------------------------
# services: Cloud Run / deploy config keyed by repo id.
# ---------------------------------------------------------------------------
# Consumed by /canary. Repos without a `services:` entry are treated as
# non-deployable (e.g., docs-only, iOS, infrastructure-only repos).
# Repos that deploy via a different mechanism (TestFlight, custom script)
# can be omitted here and handled in /wrapup Step 6.

services:
  api:
    cloud_run_service: api
    region: us-central1
    image_path: us-central1-docker.pkg.dev/<gcp-project>/api/api
  web:
    cloud_run_service: web
    region: us-central1
    image_path: us-central1-docker.pkg.dev/<gcp-project>/web/web
