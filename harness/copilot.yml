# harness/copilot.yml — the GitHub Copilot CLI adapter (REQ-656). Data, not code:
# every key is validated by tools/adlc/harness_adapter.py and an unknown key is a
# loud error. Its goldens live in harness/copilot/rendered/. The facts here are the
# vendor docs as read on 2026-10-30, not a run: no copilot binary was available, and
# BR-13's dogfood is owed. Anything a probe would decide stays unverified.
name: copilot
schema_version: 2
binary: copilot

paths:
  # Rendered copies, user-level only; a project render never writes these (ADR-9).
  agents:
    user: $HOME/.copilot/agents
    mode: rendered
  skills:
    user: $HOME/.agents/skills
    mode: mounted
  # Copilot has no committed allowlist, and no permissions.user path is declared:
  # the printed line is the user-scope render (BR-6).
  permissions:
    mode: printed
  hooks:
    project: .github/hooks/adlc.json
    mode: rendered
  instructions:
    project: AGENTS.md
    mode: rendered

formats:
  agents: copilot-agent-md
  permissions: copilot-tool-flags
  hooks: copilot-hooks-json
  instructions: agents-md

tool_map:
  Read: read
  Grep: search
  Glob: search
  Edit: edit
  Write: edit
  NotebookEdit: edit
  Bash: execute
  Agent: unsupported

# OQ-4: filled from the installed CLI's model list at the dogfood. Until then
# model: is omitted and Copilot applies its own default (BR-4).
tier_map:
  opus: unverified
  sonnet: unverified
  haiku: unverified

# The printed line is the user-scope render, so the deny tier is a hard deny there.
deny_tier_render:
  user: deny

accepted_fidelity:
  # A printed render obeys the committed-scope fence rule (BR-6).
  fence.partial-source: {user: inexpressible}
  default_mode: {user: inexpressible}
  # Omitted until deny_under_allow.prefix reads pass (OQ-8).
  "git.read:git branch": {user: inexpressible}
  "git.write:git push": {user: inexpressible}
  # The bare `git -C` prefix covers every git subcommand, and a --deny-tool on the
  # plain spelling is not shown to match the -C spelling (OQ-9). One entry per
  # git.* routine entry it would have doubled.
  "git.read:git -C": {user: inexpressible}
  "git.config.identity:git -C": {user: inexpressible}
  "git.write:git -C": {user: inexpressible}

trust:
  mechanism: flag
  detail: --trust-folder

hook_events:
  session-start: sessionStart
  subagent-start: subagentStart
  # No event distinguishes compaction in the docs read; unsupported until the
  # dogfood shows otherwise.
  session-compact: unsupported
hook_timeout_unit: s
# Filled by REQ-660 OQ-1 from a captured payload, never from documentation (spec).
hook_payload:
  session_id: unsupported
  cwd: unsupported
  transcript_path: unsupported
# The docs say plain stdout is not injected: context is {"additionalContext": "..."}.
hook_output:
  ethos-inject: json:additionalContext

doctor_rows:
  - id: skills-view
    kind: path-exists
    target: $HOME/.agents/skills
    remediation: run ./install.sh from the toolkit clone
    fact: "the skills-only view Copilot CLI reads"

fidelity_notes:
  - "copilot: `git push` and `git branch` will prompt while deny_under_allow.prefix reads unverified (OQ-8)."
  - "copilot: every `git -C ...` call will prompt while deny_under_allow.git-c reads unverified (OQ-9)."
  - "copilot: subcommand granularity admits every argument after a prefix, so `git worktree` also admits `git worktree remove --force`. Allowlists match spelling; they are not the gate."

# The exec engine's keys are REQ-659's and REQ-662's; none is verified on a real install.
exec:
  flags: unverified

capabilities:
  deny: "yes"
  # subagentStart is rendered, but no run has shown it reaching a subagent, so the
  # ETHOS-first line stays in every rendered agent (ADR-13).
  subagent_start_hook: "no"
  compact_rehook: "no"
  agent_tool_restriction: enforced
  # The plan's "subcommand prefix". REQ-657's `subcommand` caps a spelling at two
  # tokens, which would turn `gh pr view` into `gh pr` and every deny into two
  # tokens; `token-prefix` is the same matcher with no cap (ADR-1).
  allowlist_granularity: token-prefix
  committable_allowlist: "no"
  git_c_spelling: [[git, -C]]
  never_restore: [env-prefix, shell-opener]
  deny_under_allow:
    prefix: {mechanism: deny, result: unverified, harness_version: unverified, source: probe}
    git-c: {mechanism: deny, result: unverified, harness_version: unverified, source: probe}
    env-prefix: {mechanism: deny, result: unverified, harness_version: unverified, source: probe}
    shell-opener: {mechanism: deny, result: unverified, harness_version: unverified, source: probe}
  # Declared because the loader requires it; never on the paste-ready line (BR-6).
  fence_broad_spelling: [if, "[", -f, .adlc/partials/]
