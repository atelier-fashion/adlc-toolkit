# harness/claude.yml — the Claude Code adapter (REQ-657). Data, not code: every
# key below is validated by tools/adlc/harness_adapter.py, and an unknown key is
# a loud error. The goldens it renders live in harness/claude/rendered/.
name: claude
schema_version: 1
binary: claude

paths:
  # Claude Code's own mounts (REQ-654 BR-6): served by install.sh, nothing rendered.
  # The agents mount is the canonical agents/ dir, so `adlc agents render --harness
  # claude` is REQ-516's in-place model: stamp (ADR-9).
  agents:
    user: $HOME/.claude/agents
    mode: mounted
  skills:
    user: $HOME/.claude/skills
    mode: mounted
  # The allowlist and the hooks travel in the project layer (BR-3): no user path.
  permissions:
    project: .claude/settings.json
    mode: rendered
  hooks:
    project: .claude/settings.json
    mode: rendered
    # Copilot CLI and Cursor read this render as-is, so it carries no --harness
    # argument; the partial tells the readers apart from the payload (BR-10).
    read_by: [copilot, cursor]
  instructions:
    project: CLAUDE.md
    mode: rendered

formats:
  agents: claude-agent-md
  permissions: claude-settings-json
  hooks: claude-settings-json
  instructions: claude-md-import

tool_map:
  Read: Read
  Grep: Grep
  Glob: Glob
  Bash: Bash
  Write: Write
  Edit: Edit
  Agent: Agent
  WebFetch: WebFetch
  WebSearch: WebSearch

tier_map:
  opus: opus
  sonnet: sonnet
  haiku: haiku

# The deny tier renders as Claude's `ask` list: a human confirms in session (Rule B).
deny_tier_render:
  project: confirm

default_mode_map:
  key: permissions.defaultMode
  values:
    acceptEdits: acceptEdits

accepted_fidelity:
  # A committed opening-token prefix would be a new pre-approval (Rule A): withheld. Under
  # --exec no rule matches a fence (REQ-682 probe rows 8, 9): fences run through the
  # fence runner `exec.fence_runner` names, and no fence rule is rendered.
  fence.partial-source: {project: inexpressible, exec: inexpressible}
  # `git push:*` matches `git push --force origin feature`; today's template has the
  # same exposure, grandfathered by Rule A (BR-9).
  git.push.force: residual:exact-deny

# ASSUME-010 (invalidated by REQ-664's probe): Claude Code 2.1.258 ignores a
# project's permissions.allow in an untrusted workspace. Declared, not exercised.
trust:
  mechanism: user-config-entry
  detail: "projects[<absolute workspace path>].hasTrustDialogAccepted: true in the home directory's .claude.json"
sandbox_can_reach_common_gitdir: true

# The exec engine (REQ-659): how `adlc sprint-exec` launches this harness headless.
# Validated by harness_adapter.py at exec schema 2 (REQ-662); an unknown key is a loud
# error. Facts here come from .adlc/research/harness-probes/claude-exec-manual.md
# (claude 2.1.258, logged out) and the claude.json probe rows; the allow and deny tiers
# are unverified against a model until a logged-in run.
exec:
  exec_schema_version: 2
  # REQ-662 BR-11's probe gate is for the harnesses REQ-662 adds. This block stands on
  # REQ-659's recorded evidence (claude-exec-manual.md, the claude.json rows), so it is
  # `recorded`, carries no `probes`, and its version is the claude.json run's.
  harness_version: "2.1.316 (Claude Code)"
  verification: recorded
  status: verified
  working_copy: {strategy: worktree}
  # What the engine does per run. Not `trust` above, which is what the harness reads:
  # both tiers go on the command line, and on a linked worktree Claude keys trust by
  # the main repo root, so a per-working-copy entry would be inert (ADR-5).
  trust_grant: none
  # Printed on stderr when a project allowlist was dropped; surfaced, never parsed.
  trust_notice: "permissions.allow"
  # The prompt is on stdin. `prompt_flag` is the launch token that makes a launch the
  # stdin-prompt probe's `with-prompt-flag` variant; the loader holds `prompt_variant` to
  # whether `launch` holds those tokens.
  prompt_delivery: stdin
  prompt_flag: [-p]
  prompt_variant: with-prompt-flag
  launch: [-p, --output-format, json]
  # The whole argv after the binary on a resume, in place of `launch`. `{session_id}` is
  # substituted as one whole token.
  resume: [-p, --output-format, json, --resume, "{session_id}"]
  # The flags an operator may pass with --harness-flag. Neither relaxes a permission.
  operator_flags: [--model, --max-turns]
  # An exec run loads no hook: `--setting-sources ""` and the hook-free --settings file
  # leave none, and ETHOS reaches the model as the prompt the engine builds (REQ-659 BR-6).
  context_delivery: prompt
  # Both tiers travel on the command line: `allow_flag` and `deny_flag`, each rule spelled
  # by `shell_rule` or `shell_rule_exact`, and the same tiers in the settings file at
  # `settings_keys`. No rule file is written into the working copy, and no user policy file.
  allow_render: flags
  deny_render: flags
  user_policy_file: none
  allow_flag: --allowedTools
  deny_flag: --disallowedTools
  add_dir_flag: --add-dir
  shell_rule: "Bash(%s:*)"
  shell_rule_exact: "Bash(%s)"
  # The non-shell tools a pipeline uses that touch no file. Rules for the shell come from
  # the exec-scope render of templates/permissions.yml.
  allow_tools: [Agent, Skill, TodoWrite]
  # The file tools, each scoped to a root and never bare: a bare `Write` wrote outside the
  # working copy, so the model could rewrite the toolkit the orchestrator sources at approve
  # (BUG-265). `{root}` is an absolute path, so the rule reads `Edit(//<root>/**)`, Claude's
  # spelling for an absolute path; an `Edit` rule covers Write, Edit and NotebookEdit. The
  # write roots are every repo's working copy (and a close-out's --add-dir); the read root is
  # ToolkitRoot. Claude's own path check keeps shell reads and writes inside the same roots.
  file_rules:
    write: ["Edit(/{root}/**)", "Read(/{root}/**)"]
    read: ["Read(/{root}/**)"]
  # The fence runner (REQ-682 ADR-1): the one executable an exec model runs a toolkit
  # fence through, admitted as `Bash(<ToolkitRoot>/tools/adlc/fence-run:*)` with the root
  # resolved once by the engine. It replaces `ADLC_TOOLKIT_ROOT=` and the
  # `if [ -f .adlc/partials/` opener, which admitted nothing a fence needs (probe rows 9, 14).
  fence_runner: tools/adlc/fence-run
  # The shared-base rule drops `git push`, `git branch` and `git worktree` at exec
  # scope, so the pipeline's own calls are listed here. Each shares a command base with
  # a deny, so each is exact: as a prefix rule, `git push -u origin <branch>` admitted
  # `<branch> main` and `<branch> --force` after it (BUG-260). `{branch}` is the REQ's
  # own branch.
  allow_extra_exact:
    - [git, push]
    - [git, push, -u, origin, "{branch}"]
    - [git, push, origin, "{branch}"]
    - [git, branch, --show-current]
    - [git, branch, --list]
    - [git, worktree, list]
  # Denied here and not in templates/permissions.yml: an interactive session has no
  # use for them, and a person there can still approve a one-way move.
  engine_deny:
    - [az, repos, pr]
    - [git, push, --force-with-lease]
    - [git, push, origin, "+*"]
    # A `*` inside a deny is a glob, spelled `Bash(git -C * push --force*)`: claude 2.1.316
    # matched nothing with `Bash(git -C * push --force:*)` (BUG-269). No allow matches
    # `git -C`, so these back a future allow rather than any rendered today.
    - [git, -C, "*", push, --force]
    - [git, -C, "*", push, -f]
    - [git, worktree, remove]
    - [git, worktree, prune]
    - [rm, -r]
    - [rm, -fr]
    - [adlc, sprint-exec, approve]
    - [adlc, sprint-exec, reject]
    - [adlc, sprint-exec, answer]
    - [adlc, sprint-exec, abort]
    - [adlc, sprint-exec, reissue]
    - [adlc, sprint-exec, resume]
    - [adlc, sprint-exec, run]
  forbidden_flags:
    - --dangerously-skip-permissions
    - --allow-dangerously-skip-permissions
    - --permission-mode bypassPermissions
    - --yolo
    - --force
    - --allow-all
  # A logged-out run exits 1. An unmapped non-zero code is `error`.
  exit_codes: {"0": ok, "1": error}
  # `format`: how stdout is parsed. `json` is one result object (or the last JSON object
  # line); `jsonl-stream` is one event per line. `source`: where `final_message` is read,
  # `stdout` or `file`. Under `json` each field below is a key path into the result
  # object (`key` or `a.b`); under `jsonl-stream` it is `{event, key}`, the key path inside
  # the event whose `type` is `event`. Under `source: file`, `final_message` is the launch
  # placeholder naming the file the harness writes its last message to (`{last_message}`).
  # `session_id` and `final_message` are required; `is_error`, `num_turns`, `cost` and
  # `denials` are optional. No exit code means "denied": `denials` is where the result
  # lists them.
  output:
    format: json
    source: stdout
    session_id: session_id
    final_message: result
    is_error: is_error
    num_turns: num_turns
    cost: total_cost_usd
    denials: permission_denials
  env_passthrough: [HOME, PATH, ADLC_HOME, ADLC_DISABLE_DELEGATE, ADLC_FORGE_MOCK, SSH_AUTH_SOCK, GIT_SSH_COMMAND, XDG_CONFIG_HOME, TMPDIR, LANG, TERM]
  # USER reaches the macOS keychain item a stored login lives in.
  auth_env: [ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, USER]
  # BR-25: the resumed close-out reads no working-copy settings, hooks or MCP servers.
  # Every launch, not only the close-out: no user, project or local settings file is read,
  # because the operator's and the project's own allowlists hold prefix rules such as
  # `Bash(git push:*)` that re-admit what the tiers withhold (BUG-260).
  config_isolation: [--setting-sources, "", --settings, "{settings}", --strict-mcp-config]
  config_isolation_help: [--setting-sources, --settings, --strict-mcp-config]
  settings_keys: {allow: [permissions, allow], deny: [permissions, deny]}
  # The isolation flags above keep Claude from reading any settings or MCP file in the
  # working copy or the user's home, so the engine owns no config surface here and has no
  # bypass key to scan. The loader allows both empty only with `config_isolation` set.
  config_surfaces: []
  bypass_config_keys: {}
  # No probe has measured whether a settings file edited mid-run is re-read: `unknown`,
  # read as `live`. The rules are on the command line and in a settings file in the run
  # directory, outside every working copy.
  rules_reload: unknown
  # shell-timeout reads `pass` in claude.json: a 125 s sleep in one shell call completed,
  # so a delegated adlc-read fits and ADLC_DISABLE_DELEGATE is not set.
  shell_timeout_s: {value: 125, verified: true, delegate: supported}
  # exec_matcher models Claude's statement matching, so a fence may route `direct`.
  matcher: claude
  # OQ-4: a sandboxed session has not been shown to reach the common git dir.
  sandbox_refuse:
    files: [$HOME/.claude/settings.json, .claude/settings.json, .claude/settings.local.json]
    key: [sandbox, enabled]
  # Defense in depth, not a gate. What stops a one-way move is the approval ledger,
  # the pinned orchestrator merge, the detached-worktree trial merge and rebase, the
  # local diff gates, the child credentials, branch protection and the exit checks.
  residuals:
    - a command wrapped in sh -c, env, xargs, python -c, npx, npm run or find -exec
    - a call routed through gh api, which reaches merge and ref-update endpoints
    - a flag in a position a prefix rule does not match, such as gh -R <repo> pr merge
    - a semantic equivalent of a denied move under another spelling
    - the Azure DevOps flag routes, narrowed for the forge wrappers only
    - a merge bot on the forge that acts on a label or a comment
    - a fence-run fence runs toolkit code no per-command rule sees; the reach audit bounds it, not the allowlist

hook_events:
  # A SessionStart group with no matcher also fires on compact, so session-start
  # names the other three sources and compaction gets its own group.
  session-start: {event: SessionStart, matcher: "startup|resume|clear"}
  session-compact: {event: SessionStart, matcher: compact}
  # Present in 2.1.258's hook schema, but it delivers context only as JSON
  # additionalContext; unverified for a plain-stdout command (spec, Deferred).
  subagent-start: unsupported
hook_timeout_unit: s
hook_payload:
  session_id: session_id
  cwd: cwd
  transcript_path: transcript_path

capabilities:
  deny: "yes"
  subagent_start_hook: "no"
  compact_rehook: "yes"
  agent_tool_restriction: enforced
  allowlist_granularity: prefix
  committable_allowlist: "yes"
  # No `git -C` allow is rendered. Under one, a deny on the plain spelling does not stop
  # the `-C` form: ask-tier-deny/wrapped-allow reads `fail` on 2.1.316 (BUG-269).
  git_c_spelling: []
  never_restore: []
  deny_under_allow:
    prefix: {mechanism: confirm, result: pass, harness_version: n/a, source: grandfathered}
    # The schema spells a failed probe `unverified`. The result file's wrapped-allow reads
    # `fail`: the probe put the deny in permissions.deny and the `-C` push ran anyway.
    git-c: {mechanism: deny, result: unverified, harness_version: "2.1.316 (Claude Code)", source: probe}
