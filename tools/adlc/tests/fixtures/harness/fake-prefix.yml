# Test-only prefix-matching adapter (REQ-657 AC-7): the git -C shared-base vector.
name: fake-prefix
schema_version: 1
binary: fake-prefix
paths:
  permissions:
    project: .fake-prefix/permissions.json
    mode: rendered
formats:
  permissions: rules-json
tool_map:
  Read: Read
  Grep: Grep
  Glob: Glob
  Bash: Bash
tier_map:
  opus: opus
deny_tier_render:
  project: confirm
trust:
  mechanism: none
  detail: none needed
hook_events:
  session-start: unsupported
  session-compact: unsupported
  subagent-start: unsupported
hook_payload:
  session_id: unsupported
  cwd: unsupported
  transcript_path: unsupported
capabilities:
  deny: "yes"
  subagent_start_hook: "no"
  compact_rehook: "no"
  agent_tool_restriction: none
  allowlist_granularity: prefix
  committable_allowlist: "yes"
  git_c_spelling: [[git, -C]]
  deny_under_allow: {}
  fence_broad_spelling: [if, "[", -f, .adlc/partials/]
